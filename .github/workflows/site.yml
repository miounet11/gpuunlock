name: site

# The site carries factual claims (card status, measured ratios, upstream release pins).
# Those drift silently when someone edits a data file and forgets the copy, so run the
# checks on every push that touches the site or its data.
on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  schedule:
    # Upstream can re-run a benchmark at any time. Without this, the copied evidence and
    # the numbers derived from it would stay green forever because nothing ever looked.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the alert step below writes anything, and it writes an issue.
      issues: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap.ts reads `git log` for real lastmod values. A shallow clone would
          # silently fall back to the fixed date and defeat the point.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Data integrity
        run: npm test

      # Scheduled/manual runs also check the copy under docs/evidence/ against upstream.
      # Push and PR runs skip it: the network makes those runs flaky without telling us
      # anything, because they are already checking a tree the author just edited.
      - name: Upstream evidence is current
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:evidence

      - name: Build
        run: npm run build

      # Daily runs check that the host actually serves this build, not an older one. The
      # local build and the live host drift apart the moment a deploy is skipped, and
      # nothing else in this pipeline can see that: the tree is green either way.
      - name: Deployed site matches this build
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify:deploy

      # A red run on a schedule is easy to never look at, and this repository had exactly
      # that: the live host lagged the build by 77 URLs while every local check stayed green.
      # Turning the failure into an issue puts it where someone will see it, and keeps one
      # issue per problem instead of one per night.
      #
      # Only scheduled and manual runs get here, and the step is skipped on success, so a
      # green pipeline never touches the issue tracker.
      - name: Open or update an issue when the live host is stale
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live site does not match this build"
          body=$(printf 'The scheduled check found the deployed host out of date.\n\nRun: %s\n\n%s\n' "$RUN_URL" "$(git log -1 --format='Build commit: %h %s')")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
