# gpuunlock.com — the card reference site (device IDs, per-card status, same-card benchmarks).
#
# It is a separate Next.js deployment from gpu-unlock.com (which owns the build/install
# docs), so the two roots have different content. Duplicated paths 301 across the two
# hosts from the app itself; nginx only has to route each apex to its own process.
#
# This copy is the contract, like deploy/ecosystem.config.cjs: remote-bootstrap.sh installs
# it to /etc/nginx/sites-available/gpuunlock.conf and reloads nginx. Edit it here, not on the
# host — the next deploy overwrites the host copy.
#
# Paths below are written against the default /opt/gpuunlock. When GPUUNLOCK_DIR points
# somewhere else, deploy/nginx-install.sh rewrites that prefix before installing, so the
# static alias and the proxy cannot drift from the tree pm2 actually runs.

server {
    listen 80;
    listen [::]:80;
    server_name gpuunlock.com www.gpuunlock.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://gpuunlock.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gpuunlock.com;

    ssl_certificate /etc/letsencrypt/live/gpuunlock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpuunlock.com/privkey.pem;

    return 301 https://gpuunlock.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gpuunlock.com;

    ssl_certificate /etc/letsencrypt/live/gpuunlock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpuunlock.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gpu_unlock_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/gpuunlock-analytics.conf;

    # Hashed build assets: immutable and served straight from disk so CSS/JS survive
    # a pm2 restart.
    location /_next/static/ {
        alias /opt/gpuunlock/.next/standalone/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
    }
}
