# Log format for gpu-unlock.com, paired with /etc/nginx/snippets/gpu-unlock-analytics.conf.
#
# `log_format` is http-context only, which is where `include /etc/nginx/conf.d/*.conf` sits.
# JSON with a fixed field order so a report can read it without guessing field positions.
log_format gpu_unlock_analytics escape=json
  '{"t":"$time_iso8601",'
  '"ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent",'
  '"cf_ray":"$http_cf_ray"}';
